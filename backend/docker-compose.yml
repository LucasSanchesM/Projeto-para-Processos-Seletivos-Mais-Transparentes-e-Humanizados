
services:

  api:
    image: selecta-api
    build: .
    pull_policy: build
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672" #porta para UI de gerenciamento http
    environment:
        RABBITMQ_DEFAULT_USER: admin
        RABBITMQ_DEFAULT_PASS: 1234
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bancoDeDados
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
