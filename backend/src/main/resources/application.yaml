jwt:
  public:
    key: "classpath:app.pub"
  private:
    key: "classpath:app.key"

spring:
  application:
    name: processoseletivoapi
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:5433/bancoDeDados
    username: user
    password: "1234"
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: "1234"
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          multiplier: 10
          max-interval: 10000ms
  security:
    oauth2:
      client:
        registration:
          linkedin:
            client-id: ${LINKEDIN_CLIENT_ID:linkedin-client-id-not-configured}
            client-secret: ${LINKEDIN_CLIENT_SECRET:linkedin-client-secret-not-configured}
            client-name: LinkedIn
            provider: linkedin
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          linkedin:
            issuer-uri: https://www.linkedin.com/oauth
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
r2:
  endpoint: ${R2_ENDPOINT:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET:}
  public-base-url: ${R2_PUBLIC_BASE_URL:}
resend:
  api:
    key: "re_6kix7ry9_CXVSdegCpR46YMiycAmqy9TX" #NAO ESQUECER DE DEIXAR COMO VARIAVEL DE AMBIENTE
