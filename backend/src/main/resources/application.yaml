jwt:
  public:
    key: "classpath:app.pub"
  private:
    key: "classpath:app.key"

spring:
  application:
    name: processoseletivoapi
  datasource:
    url: jdbc:postgresql://localhost:5433/bancoDeDados
    username: user
    password: "1234"
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: "1234"
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          multiplier: 10
          max-interval: 10000ms
